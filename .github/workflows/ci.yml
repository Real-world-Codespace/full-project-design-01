name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[aws,api,notebooks,test]'
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest

  notebook-pipeline:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[aws,api,notebooks,test]'
      - name: Run notebooks from clean local data
        env:
          MPLBACKEND: Agg
        run: python scripts/run_notebooks.py
      - name: Upload reports when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-debug-artifacts
          path: |
            reports/
            data/manifests/
          if-no-files-found: ignore
