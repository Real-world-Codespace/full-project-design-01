[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooling-load-forecasting"
version = "0.1.0"
description = "Production-oriented multi-building cooling-load forecasting project"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn==1.9.0",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4", "seaborn>=0.13,<1"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
